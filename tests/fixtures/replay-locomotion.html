<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Match 3D · Courses</title>
  <link rel="stylesheet" href="../../web/theme.css">
  <link rel="stylesheet" href="../../web/match-replay.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: var(--s2) var(--s4) var(--s3); }
    .page-heading { display: flex; align-items: center; gap: var(--s4); }
    h1 { margin: 0; }
    .tools, .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
    .tools label { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-small); color: var(--muted); }
    button, select { font-family: var(--text); cursor: pointer; border: 1px solid var(--line); }
    select { height: var(--h-control); padding: 0 var(--s2); font-size: var(--fs-body); }
    .replay-stage { height: calc(100vh - 5 * var(--h-control) - 2 * var(--s4)); min-height: 360px; }
    .status { display: flex; justify-content: space-between; gap: var(--s4); margin-top: var(--s2); color: var(--muted); font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
    #error { color: var(--bad); white-space: pre-wrap; }
  </style>
  <link rel="stylesheet" href="../../web/charte.css">
</head>
<body>
  <header class="page-heading">
    <h1>Match 3D · Courses</h1>
    <div class="tools">
      <button type="button" id="pause" aria-pressed="false">Pause</button>
      <button type="button" id="step" disabled>+ 1 image</button>
      <button type="button" id="restart">Recommencer</button>
      <div class="segmented" aria-label="Vitesse de lecture">
        <button type="button" data-speed="0.5" aria-pressed="false">½×</button>
        <button type="button" data-speed="1" aria-pressed="true" class="active">1×</button>
      </div>
    </div>
  </header>
  <div class="toolbar">
    <div class="segmented" aria-label="Allure des joueurs">
      <button type="button" data-pace="mixed" aria-pressed="true" class="active">Trois allures</button>
      <button type="button" data-pace="walk" aria-pressed="false">Tous en marche</button>
      <button type="button" data-pace="jog" aria-pressed="false">Tous en course</button>
      <button type="button" data-pace="sprint" aria-pressed="false">Tous au sprint</button>
    </div>
    <div class="tools">
      <label>Duo suivi <select id="focus"><option value="0">Marche · 1.4 m/s</option><option value="1" selected>Course · 4.5 m/s</option><option value="2">Sprint · 7.5 m/s</option></select></label>
      <label>Caméra <select id="camera"><option value="close" selected>Rapprochée · trois quarts</option><option value="side">Rapprochée · profil</option><option value="game">Vue du match</option></select></label>
      <label><input type="checkbox" id="labels"> Noms</label>
    </div>
  </div>
  <main id="replay"><div id="stage" class="replay-stage three" role="img" aria-label="Six footballeurs en mouvement sur le terrain"></div></main>
  <div class="status"><output id="status">Chargement…</output><span>Marche : 2 et 17 · Course : 7 et 31 · Sprint : 11 et 44</span></div>
  <pre id="error" role="alert"></pre>
  <script type="module">
    import { LENS, Pitch3D, ready } from '../../web/replay-3d.js';

    // Positions and the replay clock are the fixture's only animation inputs.
    // Pitch3D creates, poses and renders the same figures used in a real match.
    // Its own RAF is replaced only to position the inspection camera after update.
    const reportError = error => { document.querySelector('#error').textContent += `${error}\n`; };
    window.addEventListener('error', event => reportError(event.message));
    window.addEventListener('unhandledrejection', event => reportError(event.reason));

    const params = new URLSearchParams(location.search);
    const paceSpeeds = { walk: 1.4, jog: 4.5, sprint: 7.5 };
    const names = ['Marche · n° 2', 'Marche · n° 17', 'Course · n° 7', 'Course · n° 31', 'Sprint · n° 11', 'Sprint · n° 44'];
    const ids = [2, 17, 7, 31, 11, 44];
    const players = ids.map((id, index) => ({ id, name: names[index], shirt: id, position: 'MC' }));
    const runners = players.map((player, index) => ({
      ...player, side: index % 2 ? 'away' : 'home', lane: index,
      pace: ['walk', 'jog', 'sprint'][Math.floor(index / 2)], distance: index % 2 ? 8 : 5,
      speed: paceSpeeds[['walk', 'jog', 'sprint'][Math.floor(index / 2)]],
      dot: { x: 0, y: 0, node: document.createElement('span'), gestures: [] },
    }));
    const replay = document.querySelector('#replay');
    Object.assign(replay, {
      stage: document.querySelector('#stage'), time: 0, run: 1, action: null, carrier: null, ballZ: 0,
      teams: {
        home: { name: 'Nice', major: '#d22c37', minor: '#151b22', keeper: '#efc444' },
        away: { name: 'Paris', major: '#155c91', minor: '#f1f1e9', keeper: '#8dcf43' },
      },
      rosters: { home: players.filter((_, index) => index % 2 === 0), away: players.filter((_, index) => index % 2 === 1) },
      names: new Map(players.map(player => [player.id, player.name])),
      shirts: new Map(players.map(player => [player.id, player.shirt])),
      dots: {
        home: new Map(runners.filter(runner => runner.side === 'home').map(runner => [runner.id, runner.dot])),
        away: new Map(runners.filter(runner => runner.side === 'away').map(runner => [runner.id, runner.dot])),
      },
    });

    let pace = Object.hasOwn(paceSpeeds, params.get('pace')) ? params.get('pace') : 'mixed';
    let speed = params.get('speed') === '0.5' ? .5 : 1;
    let paused = params.get('paused') === '1';
    let focus = Math.max(0, Math.min(2, Math.floor(Number(params.get('focus') ?? 1) || 0)));
    let cameraMode = ['close', 'side', 'game'].includes(params.get('camera')) ? params.get('camera') : 'close';
    let cameraCut = true;
    const cameraAt = { x: 0, y: 0, z: 0 }, cameraLook = { x: 0, y: 0, z: 0 };

    // Equal-length oval loops offset across the pitch: six independent clocks,
    // continuous tangents at each bend, no jump or gait reset at the loop seam.
    // The two players at each pace keep their spacing throughout every lap.
    function position(distance, lane) {
      const straight = 60, radius = 9, arc = Math.PI * radius, length = 2 * straight + 2 * arc;
      let d = ((distance % length) + length) % length;
      const middle = 22 + lane * 2.5;
      if (d < straight) return { x: 22 + d, y: middle - radius, tx: 1, ty: 0 };
      d -= straight;
      if (d < arc) {
        const angle = d / radius - Math.PI / 2;
        return { x: 82 + radius * Math.cos(angle), y: middle + radius * Math.sin(angle), tx: -Math.sin(angle), ty: Math.cos(angle) };
      }
      d -= arc;
      if (d < straight) return { x: 82 - d, y: middle + radius, tx: -1, ty: 0 };
      d -= straight;
      const angle = d / radius + Math.PI / 2;
      return { x: 22 + radius * Math.cos(angle), y: middle + radius * Math.sin(angle), tx: -Math.sin(angle), ty: Math.cos(angle) };
    }
    function updatePositions(seconds = 0) {
      for (const runner of runners) {
        const targetSpeed = paceSpeeds[pace === 'mixed' ? runner.pace : pace];
        runner.speed += (targetSpeed - runner.speed) * (1 - Math.exp(-seconds / .35));
        runner.distance += runner.speed * seconds;
        const at = position(runner.distance, runner.lane);
        Object.assign(runner.dot, { x: at.x, y: at.y });
      }
      const leader = runners[focus * 2], ahead = position(leader.distance + 8, leader.lane);
      replay.ballAt = { x: ahead.x, y: ahead.y };
    }
    for (const runner of runners) runner.speed = paceSpeeds[pace === 'mixed' ? runner.pace : pace];
    updatePositions();
    await ready;
    const view = new Pitch3D(replay);
    cancelAnimationFrame(view.frame);
    view.frame = null;

    function inspectCamera(seconds) {
      if (cameraMode === 'game') {
        view.camera.fov = LENS; view.camera.updateProjectionMatrix();
        return;
      }
      const a = runners[focus * 2], b = runners[focus * 2 + 1];
      const heading = position((a.distance + b.distance) / 2, (a.lane + b.lane) / 2);
      const look = { x: (a.dot.x + b.dot.x) / 2 - 52.5, y: 1.1, z: (a.dot.y + b.dot.y) / 2 - 34 };
      const normal = { x: -heading.ty, z: heading.tx };
      const back = cameraMode === 'side' ? 0 : -7;
      const at = { x: look.x + normal.x * 14 + heading.tx * back, y: cameraMode === 'side' ? 3.5 : 5.5, z: look.z + normal.z * 14 + heading.ty * back };
      const blend = cameraCut ? 1 : 1 - Math.exp(-seconds / .15);
      for (const axis of ['x', 'y', 'z']) {
        cameraAt[axis] += (at[axis] - cameraAt[axis]) * blend;
        cameraLook[axis] += (look[axis] - cameraLook[axis]) * blend;
      }
      cameraCut = false;
      view.camera.fov = 38; view.camera.updateProjectionMatrix();
      view.camera.position.set(cameraAt.x, cameraAt.y, cameraAt.z);
      view.camera.lookAt(cameraLook.x, cameraLook.y, cameraLook.z);
    }
    const status = document.querySelector('#status');
    function draw(milliseconds) {
      replay.time += milliseconds;
      updatePositions(milliseconds / 1000);
      view.update(milliseconds);
      inspectCamera(milliseconds / 1000);
      view.render();
      const duo = runners.slice(focus * 2, focus * 2 + 2);
      status.textContent = `${paused ? 'Pause' : 'Lecture'} · ${(replay.time / 1000).toFixed(2)} s · ${speed}× · n° ${duo[0].id} / ${duo[1].id} · ${duo[0].speed.toFixed(1)} m/s`;
    }
    function refreshControls() {
      document.querySelector('#pause').textContent = paused ? 'Lire' : 'Pause';
      document.querySelector('#pause').setAttribute('aria-pressed', String(paused));
      document.querySelector('#step').disabled = !paused;
      document.querySelector('#focus').value = String(focus);
      document.querySelector('#camera').value = cameraMode;
      for (const button of document.querySelectorAll('[data-speed], [data-pace]')) {
        const selected = button.dataset.speed ? Number(button.dataset.speed) === speed : button.dataset.pace === pace;
        button.classList.toggle('active', selected); button.setAttribute('aria-pressed', String(selected));
      }
    }
    document.querySelector('#pause').addEventListener('click', () => { paused = !paused; refreshControls(); });
    document.querySelector('#step').addEventListener('click', () => { if (paused) draw(1000 / 60); });
    document.querySelector('#restart').addEventListener('click', () => {
      replay.time = 0; replay.run++; cameraCut = true;
      runners.forEach((runner, index) => { runner.distance = index % 2 ? 8 : 5; runner.speed = paceSpeeds[pace === 'mixed' ? runner.pace : pace]; });
      draw(0);
    });
    document.querySelectorAll('[data-speed]').forEach(button => button.addEventListener('click', () => { speed = Number(button.dataset.speed); refreshControls(); }));
    document.querySelectorAll('[data-pace]').forEach(button => button.addEventListener('click', () => { pace = button.dataset.pace; refreshControls(); }));
    document.querySelector('#focus').addEventListener('change', event => { focus = Number(event.target.value); cameraCut = true; });
    document.querySelector('#camera').addEventListener('change', event => { cameraMode = event.target.value; cameraCut = true; });
    document.querySelector('#labels').addEventListener('change', event => { runners.forEach(runner => runner.dot.node.classList.toggle('on', event.target.checked)); });
    window.addEventListener('keydown', event => {
      if (event.code === 'Space' && !['INPUT', 'SELECT', 'BUTTON'].includes(event.target.tagName)) {
        event.preventDefault(); paused = !paused; refreshControls();
      }
    });
    // Deterministic warm-up also permits reproducible paused pose inspection.
    const warmup = Math.min(120, Math.max(0, Number(params.get('t') ?? .8) || 0));
    for (let elapsed = 0; elapsed < warmup * 1000; elapsed += 1000 / 60) {
      replay.time += 1000 / 60; updatePositions(1 / 60); view.update(1000 / 60);
    }
    refreshControls(); draw(0);
    let last = performance.now(), frame;
    function tick(now) {
      const dt = Math.max(0, Math.min(64, now - last)); last = now;
      draw(paused ? 0 : dt * speed);
      frame = requestAnimationFrame(tick);
    }
    frame = requestAnimationFrame(tick);
    window.addEventListener('pagehide', () => { cancelAnimationFrame(frame); view.dispose(); }, { once: true });
  </script>
</body>
</html>
