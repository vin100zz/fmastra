<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Infobulle d’un joueur au direct · Football Manager</title>
<link rel="stylesheet" href="charte.css">
<style>
/* ——— Proposition pour la charte : l’aperçu d’un joueur au survol (.peek) ———
   Le panneau du menu (--panel, --shadow-float, --radius-box), une flèche vers la ligne visée ; dedans, les composants
   de la fiche et de l’aperçu tels quels : tuiles, faits, intertitres, radar, attributs. */
.peek{position:absolute;z-index:5;display:flex;flex-direction:column;width:348px;padding-bottom:var(--s2);border-radius:var(--radius-box);background:var(--panel);box-shadow:var(--shadow-float);font:400 var(--fs-body)/18px var(--text);color:var(--ink)}
.peek::before{content:"";position:absolute;left:-4px;top:var(--arrow,40px);width:8px;height:8px;margin-top:-4px;background:var(--panel);box-shadow:-1px 1px 0 #1018280d;transform:rotate(45deg)}
.peek.compact{width:280px}
.peek-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s3)}
.peek-head .kit-shirt{width:32px;height:32px}
.peek-name{display:flex;flex-direction:column;min-width:0;flex:1}
.peek-name>strong{overflow:hidden;font:700 var(--fs-figure)/20px var(--text);color:var(--strong);white-space:nowrap;text-overflow:ellipsis}
.peek-name>span{font-size:var(--fs-small);line-height:14px;color:var(--muted)}
.peek .tiles{padding:0 var(--s3) var(--s1)}
.peek .tile{min-width:0}
.peek .tile.split{flex:none}
.peek .rail-section{padding-bottom:0}
.peek .fact>strong{font-weight:600}
.peek .radar-rows{padding:var(--s1) 0 0}
.peek .attributes-grid{column-gap:var(--s4)}
/* Compacte : les étoiles sur la ligne du nom, l’état en icônes. */
.peek-stars{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-small);color:var(--muted)}
.peek-state{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s2) var(--s3) 0}
.peek-state>span{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--strong)}
/* Comparée : deux joueurs, deux colonnes de valeurs ; l’entrant dans l’or du radar, le sortant en trait de l’encre atténuée. */
.peek-duo{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;align-items:center;column-gap:var(--s2);height:var(--h-row);padding:0 var(--s3)}
.peek-duo>:not(:first-child){display:flex;align-items:center;justify-content:flex-end;gap:6px}
.peek-duo>:first-child{color:var(--muted)}
.peek-duo.key>:first-child{font-weight:700;color:var(--ink)}
.peek-duo.key>:first-child::after{content:"";display:inline-block;width:5px;height:5px;margin-left:6px;border-radius:50%;background:var(--accent);vertical-align:middle}
.peek-duo.head{height:auto;padding-top:var(--s3);padding-bottom:var(--s2)}
.peek-duo.head>:not(:first-child){flex-direction:column;align-items:flex-end;gap:2px;font:600 var(--fs-small)/14px var(--text);color:var(--strong)}
.peek-duo .swatch{display:block;width:24px;margin-top:2px;height:0;border-top:2px solid var(--star)}
.peek-duo .swatch.out{border-top:2px dashed var(--muted)}
.peek-duo .better{font-weight:700}
.peek-duo .fatigue .gauge{width:24px}
.radar-shape.out{fill:none;stroke:var(--muted);stroke-dasharray:4 3}
.radar-dot.out{fill:var(--muted)}

/* ——— Mise en page de la maquette (rien que l’application utilise) ——— */
body{margin:0;background:var(--line)}
.board{display:flex;flex-direction:column;gap:var(--s6);width:1920px;margin:0 auto;padding:40px 0}
.board-head{display:flex;align-items:baseline;gap:var(--s4);padding:0 48px var(--s3);border-bottom:var(--mark) solid var(--accent)}
.board-head h1{margin:0;font:700 semi-condensed var(--fs-hero)/1 var(--display);text-transform:uppercase;color:var(--strong)}
.piste{display:flex;flex-direction:column;gap:var(--s3)}
.piste-head{display:flex;align-items:baseline;gap:var(--s4);padding:0 48px}
.piste-head h2{margin:0;font:700 semi-condensed var(--fs-page)/32px var(--display);text-transform:uppercase;color:var(--strong)}
.piste-head p{margin:0;color:var(--ink-2)}
.notes{display:flex;gap:40px;padding:0 48px}
.notes dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s1) var(--s3);margin:0;max-width:560px}
.notes dt{font:700 semi-condensed var(--fs-small)/18px var(--display);letter-spacing:var(--caps);text-transform:uppercase;color:var(--title-ink)}
.notes dd{margin:0;color:var(--ink-2)}
.screen{position:relative;display:grid;grid-template-columns:400px minmax(0,1fr) 500px;gap:var(--s2);width:1920px;height:1080px;padding:var(--s2);background:var(--bg);overflow:hidden}
.col{display:flex;flex-direction:column;gap:var(--s2);min-height:0}
.squad-card{flex:1;min-height:0;overflow:hidden}
.squad-row.hover,.squad-row.hover:nth-child(even){background:var(--panel-3)}
.squad-row .rating{justify-self:end}
.cursor{position:absolute;z-index:6;width:16px;height:22px;pointer-events:none;filter:drop-shadow(0 1px 1px #0006)}
.cursor path{fill:#fff;stroke:#000;stroke-width:1.2;stroke-linejoin:round}
.hero-side{display:flex;align-items:center;gap:var(--s3);flex:1}
.hero-side.away{justify-content:flex-end}
.hero .tile.match-score{flex:none;flex-direction:row;align-items:center;gap:var(--s3)}
.big-score{font:700 semi-condensed var(--fs-hero)/1 var(--display);color:var(--strong)}
.turf{position:relative;flex:none;aspect-ratio:105/68;border-radius:var(--radius-box) var(--radius-box) 0 0;background:repeating-linear-gradient(90deg,var(--pitch-a) 0 9.09%,var(--pitch-b) 9.09% 18.18%)}
.turf::before{content:"";position:absolute;inset:16px;border:2px solid var(--pitch-line);border-radius:2px;background:linear-gradient(var(--pitch-line),var(--pitch-line)) center/2px 100% no-repeat}
.turf::after{content:"";position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid var(--pitch-line);border-radius:50%;transform:translate(-50%,-50%)}
.turf-box{position:absolute;top:28%;bottom:28%;width:15%;border:2px solid var(--pitch-line)}
.turf-box.left{left:16px;border-left:0}.turf-box.right{right:16px;border-right:0}
.commands{display:flex;align-items:center;gap:var(--s2)}
.commands .button.primary{margin-left:auto}
.ghost{flex:1;min-height:0}
.ghost .card-body{display:flex;flex-direction:column;gap:var(--s2)}
.ghost i{display:block;height:var(--s3);border-radius:var(--radius-chip);background:var(--panel-2)}
</style>
</head>
<body>
<div class="app board">
<header class="board-head"><h1>Le joueur au survol, en direct</h1><span class="label">Trois pistes · thème clair · 1920 × 1080</span></header>
<div id="pistes"></div>
</div>

<script>
// ——— Données de la maquette ———
const OM={name:'Marseille',body:'#ffffff',minor:'#2faee0',third:'#2faee0',ink:'#0b121a'};
const LOSC={name:'Lille',body:'#e01e13',minor:'#1d2b5c',third:'#1d2b5c',ink:'#ffffff'};
const LINE={GB:'gk',DC:'',DG:'',DD:'',MDC:'mid',MC:'mid',MOC:'mid',AILG:'att',AILD:'att',BU:'att'};
// [numéro, poste, nom, note, fatigue %, marques]
const XI=[[12,'GB','Jeffrey de Lange','6.9',1],[13,'DC','Derek Cornelius','7.0',7],[18,'DC','Bamo Meïté','6.7',6],[21,'DC','Nayef Aguerd','6.8',6],
 [23,'MDC','Pierre-Emile Højbjerg','6.9',7],[15,'MC','Himad Abdelli','7.0',6],[8,'MC','Angel Gomes','7.7',7,'goal'],[14,'AILG','Igor Paixão','7.2',6],
 [2,'AILD','Timothy Weah','6.7',7],[9,'BU','Amine Gouiri','6.8',7],[31,'BU','Faris','6.6',7]];
const BENCH=[[40,'GB','Jelle Van Neck'],[6,'DG','Ulisses Garcia'],[33,'DG','Emerson'],[32,'MDC','Tochukwu Nnadi'],[4,'MDC','CJ Egan-Riley'],
 [19,'MDC','Geoffrey Kondogbia'],[11,'MOC','Amine Harit'],[7,'BU','Neal Maupay']];
// Composites en étoiles, dans l’ordre du radar : Frappe, Créat., Progr., Déf. mil., Déf. surf., Aérien.
const LABELS=[['Frappe','Frappe : Finition 60 % · Sang-froid 25 % · Technique 15 %'],['Créat.','Création : Vision 50 % · Technique 30 % · Passe 20 %'],
 ['Progr.','Progression : Passe 45 % · Technique 30 % · Vision 15 % · Vitesse 10 %'],['Déf. mil.','Défense au milieu : Placement 45 % · Tacle 35 % · Vitesse 20 %'],
 ['Déf.<br>surf.','Défense de surface : Placement 60 % · Tacle 40 %'],['Aérien','Jeu aérien : Jeu de tête 70 % · Placement 30 %']];
const KEYS={MC:[1,2,3],AILG:[0,1,2],BU:[0,1,5]};
const ATTRS=['Centres','Coups arrêtés','Endurance','Finition','Jeu de tête','Passe','Penaltys','Placement','Sang-froid','Tacle','Technique','Vision','Vitesse'];
const KEY_ATTRS={MC:['Passe','Technique','Vision','Placement','Endurance'],AILG:['Vitesse','Technique','Centres','Finition'],BU:['Finition','Jeu de tête','Sang-froid','Technique']};
const GOMES={number:8,pos:'MC',name:'Angel Gomes',age:26,level:3.5,potential:[3.5,4],form:1,morale:'excellent',radar:[2.5,4,4.5,2.5,1.5,1],
 attrs:{Centres:11,'Coups arrêtés':12,Endurance:15,Finition:10,'Jeu de tête':6,Passe:16,Penaltys:9,Placement:12,'Sang-froid':14,Tacle:9,Technique:17,Vision:16,Vitesse:13}};
const PAIXAO={number:14,pos:'AILG',name:'Igor Paixão',age:26,level:3.5,potential:[3.5,3.5],form:2,morale:'bon',radar:[3.5,4,4,1.5,1,1.5]};
const GOUIRI={number:9,pos:'BU',short:'Gouiri',name:'Amine Gouiri',level:3.5,form:0,morale:'correct',fatigue:71,radar:[4,3.5,3,1,0.5,2.5],
 attrs:{Finition:15,'Jeu de tête':11,'Sang-froid':14,Technique:15,Vitesse:14,Endurance:12,Passe:12,Vision:13}};
const MAUPAY={number:7,pos:'BU',short:'Maupay',name:'Neal Maupay',level:3,form:-1,morale:'bon',fatigue:0,radar:[3.5,2.5,2,1.5,0.5,3],
 attrs:{Finition:14,'Jeu de tête':13,'Sang-froid':13,Technique:12,Vitesse:12,Endurance:15,Passe:11,Vision:10}};

// ——— Composants de la charte, dessinés comme sur les planches ———
let maskId=0;
const SHIRT='M14 4Q20 8.5 26 4L33 5.5L39 8.5V15.5H32.5V37.5H7.5V15.5H1V8.5L7 5.5Z';
const kit=(club,n)=>{const id=`m${++maskId}`;
 return `<span class="kit-shirt number" style="--kit-body:${club.body};--kit-minor:${club.minor};--kit-third:${club.third};--kit-ink:${club.ink}"><svg class="kit-drawing" viewBox="0 0 40 40" aria-hidden="true"><mask id="${id}"><path class="kit-mask" d="${SHIRT}"/></mask><path class="kit-base" d="${SHIRT}"/><g mask="url(#${id})"><rect class="kit-t" width="2.6" height="17"/><rect class="kit-t" x="37.4" width="2.6" height="17"/></g><path class="kit-collar" d="M14 4Q20 8.5 26 4L26.2 6.3Q20 10.8 13.8 6.3Z"/><path class="kit-outline" d="${SHIRT}"/></svg><b>${n}</b></span>`;};
const pos=p=>`<span class="position ${LINE[p]}">${p}</span>`;
const hue=v=>v<=4?4:v>=16?135:v<=10?4+(v-4)/6*46:50+(v-10)/6*85;
const rating=(v,cls='')=>`<span class="rating graded ${cls}" style="--hue:${Math.round(hue(v))}">${v}</span>`;
const noteHue=s=>hue(Math.max(0,(parseFloat(s)-4)*3.33+4));
const note=s=>`<span class="rating graded" style="--hue:${Math.round(hue(parseFloat(s)*2+2))}">${s}</span>`;
const stars=(sure,possible=sure,big=false)=>{let h='';for(let i=0;i<5;i++){const f=Math.max(0,Math.min(1,sure-i)),u=Math.max(0,Math.min(1,possible-i));h+=`<i style="--f:${f};--u:${u}"></i>`;}
 return `<span class="stars${big?' big':''}" role="img">${h}</span>`;};
const ARROWS={2:-90,1:-45,0:0,'-1':45,'-2':90},FORMS={2:'Excellente',1:'Bonne',0:'Normale','-1':'Mauvaise','-2':'Très mauvaise'};
const arrow=a=>`<span class="arrow a${a}"><svg viewBox="0 0 10 10" aria-hidden="true" style="transform:rotate(${ARROWS[a]}deg)"><path d="M1.5 5h7M5.5 2l3 3-3 3"></path></svg></span>`;
const FACES={excellent:[135,'M4.6 9.5Q8 12.8 11.4 9.5','Excellent'],bon:[88,'M4.6 10.05Q8 11.7 11.4 10.05','Bon'],correct:[50,'M4.6 10.6Q8 10.6 11.4 10.6','Correct']};
const face=m=>`<svg class="face" viewBox="0 0 16 16" style="--hue:${FACES[m][0]}"><circle class="head" cx="8" cy="8" r="8"></circle><circle class="eye" cx="5.4" cy="6.2" r="1.1"></circle><circle class="eye" cx="10.6" cy="6.2" r="1.1"></circle><path d="${FACES[m][1]}"></path></svg>`;
const gauge=p=>`<span class="fatigue"><span class="gauge ${p>=70?'bad':p>=50?'warn':''}"><i style="width:${p}%"></i></span>${p} %</span>`;
const fact=(label,value)=>`<div class="fact"><span>${label}</span><strong>${value}</strong></div>`;
const section=(title,extra='')=>`<div class="section-title"><span class="label">${title}</span>${extra}</div>`;

// Le radar de 240 × 148 des planches : centre (116, 74), un anneau de 14 par étoile.
const CX=116,CY=74,STEP=14,ANG=[-60,0,60,120,180,240];
const at=(i,r)=>[CX+r*Math.cos(ANG[i]*Math.PI/180),CY+r*Math.sin(ANG[i]*Math.PI/180)];
const poly=r=>ANG.map((_,i)=>at(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
function radar(values,role,other=null){
 const keys=KEYS[role]||[];
 let svg='';for(let k=1;k<=5;k++)svg+=`<polygon class="radar-ring${k===5?' outer':''}" points="${poly(k*STEP)}"/>`;
 ANG.forEach((_,i)=>{const [x,y]=at(i,5*STEP);svg+=`<line class="radar-spoke" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;});
 const shape=(vals,cls)=>{const pts=vals.map((v,i)=>at(i,v*STEP));return `<polygon class="radar-shape${cls}" points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`+pts.map(([x,y])=>`<circle class="radar-dot${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`).join('');};
 if(other)svg+=shape(other,' out');
 svg+=shape(values,'');
 const labels=ANG.map((_,i)=>{const [x,y]=at(i,5*STEP),right=i<3,dx=i===1||i===4?4:2,dy=i===0||i===5?-3.5:i===2||i===3?3.5:0;
  return `<span class="radar-label ${right?'right':'left'}${keys.includes(i)?' key':''}" style="left:${(x+(right?dx:-dx)).toFixed(1)}px;top:${(y+dy).toFixed(1)}px" title="${LABELS[i][1]}"><span>${LABELS[i][0]}</span></span>`;}).join('');
 return `<div class="radar-rows"><div class="radar" style="width:240px;height:148px"><svg width="240" height="148" viewBox="0 0 240 148" role="img">${svg}</svg>${labels}</div></div>`;
}

// ——— L’écran du direct ———
function squadRow(club,[n,p,name,rate,fat,mark],{bench=false,hover=false,opp=false,cls=''}={}){
 const marks=mark==='goal'?'<span class="marks"><i class="mark goal"></i></span>':'<span class="marks"></span>';
 return `<div class="squad-row${bench?' bench':''}${hover?' hover':''}${cls?' '+cls:''}" data-n="${n}">${kit(club,n)}<span class="squad-who">${pos(p)}<span>${name}</span></span>${marks}${rate?note(rate):'<span></span>'}${opp?'<span></span>':gauge(fat??0)}<span></span></div>`;}
function squadCard(opts={}){
 const rows=XI.map(r=>squadRow(OM,r,{hover:opts.hover===r[0],cls:opts.target===r[0]?'drop-hover':''})).join('');
 const bench=BENCH.map(r=>squadRow(OM,[r[0],r[1],r[2],'',0],{bench:true,hover:opts.hover===r[0],cls:opts.drag===r[0]?'dragging':''})).join('');
 return `<section class="card squad-card"><div class="live-team-pick"><div class="segmented small fill" role="group"><button type="button" class="active">Marseille</button><button type="button">Lille</button></div></div>`
  +`${section('Sur le terrain','<span class="aside">5 changements restants</span>')}${rows}${section('Remplaçants')}${bench}</section>`
  +`<section class="card"><div class="card-head"><h2>Tactique</h2></div><div class="card-body"><div class="fact"><span>Formation</span><select aria-label="Formation"><option>3-4-3</option></select></div><div class="fact"><span>Mentalité</span><div class="segmented small"><button type="button">Défensive</button><button type="button" class="active">Équilibrée</button><button type="button">Offensive</button></div></div></div></section>`;
}
const middle=()=>`<section class="card"><div class="hero duel compact" style="background:${OM.minor}">
<i class="hero-sash home-band" style="background:#ffffff"></i><i class="hero-sash home-band thin" style="background:#ffffff"></i>
<i class="hero-sash away-field" style="background:${LOSC.body};clip-path:polygon(61% 0,100% 0,100% 100%,53% 100%)"></i>
<div class="hero-side" style="color:#ffffff"><h1>Marseille</h1></div>
<div class="tile match-score"><span class="live-clock">64′</span><span class="big-score">1 – 0</span></div>
<div class="hero-side away" style="color:#ffffff"><h1>Lille</h1></div></div></section>
<div><div class="turf"><span class="turf-box left"></span><span class="turf-box right"></span></div>
<div class="ticker"><b>64′</b><span>Jeu en cours</span><span class="ticker-run"><i></i></span></div></div>
<div class="frise"><span class="frise-played" style="width:71%"></span><span class="frise-half" style="left:50%"></span><span class="frise-now" style="left:71%"></span><i class="mark goal home" style="left:42%"></i></div>
<div class="commands"><button type="button" class="button">Pause</button><button type="button" class="button">Action suivante</button><button type="button" class="button">3D</button><button type="button" class="button primary">Fin du match</button></div>
<section class="card ghost"><div class="card-head"><h2>Le fil du match</h2></div><div class="card-body"><i style="width:90%"></i><i style="width:60%"></i></div></section>`;
const right=()=>`<section class="card ghost"><div class="card-head"><h2>Les temps forts</h2></div><div class="card-body"><i style="width:70%"></i></div></section>
<section class="card ghost" style="flex:2"><div class="card-head"><h2>Ligue 1 · 11e journée</h2></div><div class="card-body"><i></i><i></i><i></i><i></i><i></i><i style="width:80%"></i></div></section>`;
const cursor=(x,n)=>`<svg class="cursor" data-row="${n}" data-x="${x}" viewBox="0 0 16 22"><path d="M1 1v17l4.4-4.2 3 6.6 2.8-1.3-3-6.4H14z"/></svg>`;
const screen=(left,peek)=>`<div class="screen"><div class="col">${left}</div><div class="col">${middle()}</div><div class="col">${right()}</div>${peek}</div>`;

// ——— Les aperçus ———
function peekFull(p,club,rowY){
 const keys=KEY_ATTRS[p.pos];
 const attrs=ATTRS.map(a=>`<div class="attribute${keys.includes(a)?' key':''}"><span>${a}</span>${rating(p.attrs[a])}</div>`).join('');
 return `<div class="peek" data-row="${rowY}" style="--arrow:40px">
<div class="peek-head">${kit(club,p.number)}<div class="peek-name"><strong>${p.name}</strong></div>${pos(p.pos)}</div>
<div class="tiles"><div class="tile"><span class="label">Âge</span><strong>${p.age}</strong></div><div class="tile split"><div><span class="label">Niveau</span><strong>${stars(p.level,p.level,true)}</strong></div><div><span class="label">Potentiel</span><strong>${stars(p.potential[0],p.potential[1],true)}</strong></div></div></div>
${section('État')}<div class="rail-section">${fact('Forme',arrow(p.form)+FORMS[p.form])}${fact('Moral',face(p.morale)+FACES[p.morale][2])}</div>
${section('Jeu',pos(p.pos))}${radar(p.radar,p.pos)}
${section('Attributs')}<div class="attributes-grid">${attrs}</div></div>`;
}
function peekCompact(p,club,rowY){
 return `<div class="peek compact" data-row="${rowY}" style="--arrow:34px">
<div class="peek-head">${kit(club,p.number)}<div class="peek-name"><strong>${p.name}</strong><span class="peek-stars">${stars(p.level,p.potential[1])}</span></div>${pos(p.pos)}</div>
${radar(p.radar,p.pos)}
<div class="peek-state"><span>${arrow(p.form)}${FORMS[p.form]}</span><span>${face(p.morale)}${FACES[p.morale][2]}</span></div></div>`;
}
function peekCompare(out,inn,rowY){
 const keys=KEY_ATTRS.BU,list=['Finition','Jeu de tête','Sang-froid','Technique','Endurance','Passe','Vision','Vitesse'];
 const duo=(label,a,b,key=false)=>`<div class="peek-duo${key?' key':''}"><span>${label}</span><span>${a}</span><span>${b}</span></div>`;
 const best=(a,b)=>[rating(a,a>b?'better':''),rating(b,b>a?'better':'')];
 const rows=list.map(a=>{const [x,y]=best(out.attrs[a],inn.attrs[a]);return duo(a,x,y,keys.includes(a));}).join('');
 return `<div class="peek" data-row="${rowY}" style="--arrow:60px">
<div class="peek-duo head"><span></span><span>${kit(OM,out.number)}<span><i class="mark off">▼</i> ${out.short}</span><i class="swatch out"></i></span><span>${kit(OM,inn.number)}<span><i class="mark on">▲</i> ${inn.short}</span><i class="swatch"></i></span></div>
${duo('Niveau',stars(out.level),stars(inn.level))}${duo('Fatigue',gauge(out.fatigue),gauge(inn.fatigue))}${duo('Forme',arrow(out.form),arrow(inn.form))}${duo('Moral',face(out.morale),face(inn.morale))}
${section('Jeu',pos('BU'))}${radar(inn.radar,'BU',out.radar)}
${section('Attributs')}${rows}</div>`;
}

// ——— Les trois pistes ———
const gomesY=8,paixaoY=14,gouiriY=9;
const pistes=[
 {title:'A · L’aperçu',lede:'L’aperçu de l’écran Joueurs, sans ce qui ne sert pas pendant un match.',
  html:screen(squadCard({hover:8}),peekFull(GOMES,OM,gomesY)+cursor(200,8)),
  notes:[['Contenu','Âge, niveau et potentiel en étoiles, forme et moral, le radar au poste qu’il occupe, les treize attributs, ceux du poste marqués.'],
   ['Place','À 12 à droite de la colonne, sur le terrain, la flèche face à la ligne ; tenue dans la fenêtre.'],
   ['Déclencheur','Le pointeur 400 ms sur une ligne de l’équipe ou, pendant un temps mort, sur un maillot du terrain. Les deux camps ; la fatigue de l’adversaire ne se lit pas plus qu’ailleurs.']]},
 {title:'B · Compacte',lede:'Le profil d’un coup d’œil, sans les chiffres.',
  html:screen(squadCard({hover:14}),peekCompact(PAIXAO,OM,paixaoY)+cursor(190,14)),
  notes:[['Contenu','Sous le nom, une rangée d’étoiles : le niveau dans l’or, le potentiel en ardoise. Le radar au poste, forme et moral.'],
   ['Taille','280 de large, 240 de haut : elle ne couvre que le bord du terrain.'],
   ['Suite','Les attributs restent sur la fiche, ouverte après le match.']]},
 {title:'C · Comparée',lede:'Pendant un changement, le sortant face à l’entrant.',
  html:screen(squadCard({target:9,drag:7}),peekCompare(GOUIRI,MAUPAY,gouiriY)+cursor(170,9)),
  notes:[['Déclencheur','Un remplaçant glissé ou choisi, puis la ligne visée : l’aperçu passe en comparaison. Hors changement, la piste A.'],
   ['Lecture','Deux colonnes, le sortant ▼ puis l’entrant ▲ ; la meilleure valeur en 700. Au radar, l’entrant dans l’or, le sortant en pointillé à l’encre atténuée, au poste visé.'],
   ['Charte','Un composant à ajouter : « Aperçu au survol » (.peek), son mode comparé (.peek-duo) et la seconde forme du radar (.radar-shape.out).']]}];
document.getElementById('pistes').outerHTML=pistes.map(p=>`<section class="piste"><div class="piste-head"><h2>${p.title}</h2><p>${p.lede}</p></div>${p.html}<div class="notes">${p.notes.map(([t,d])=>`<dl><dt>${t}</dt><dd>${d}</dd></dl>`).join('')}</div></section>`).join('');
// Chaque aperçu à 12 à droite de la colonne, sa flèche face au milieu de la ligne visée ; le pointeur sur son nom.
document.querySelectorAll('.screen').forEach(screen=>{const box=screen.getBoundingClientRect();
 const row=n=>screen.querySelector(`.squad-row[data-n="${n}"]`).getBoundingClientRect();
 screen.querySelectorAll('.peek').forEach(peek=>{const r=row(peek.dataset.row),col=screen.querySelector('.col').getBoundingClientRect();
  peek.style.left=`${col.right-box.left+12}px`;peek.style.top=`${r.top+r.height/2-box.top-parseFloat(peek.style.getPropertyValue('--arrow'))}px`;});
 screen.querySelectorAll('.cursor').forEach(c=>{const r=row(c.dataset.row);c.style.left=`${r.left-box.left+Number(c.dataset.x)}px`;c.style.top=`${r.top-box.top+12}px`;});});
</script>
</body>
</html>
